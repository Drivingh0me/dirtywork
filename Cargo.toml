[package]
name = "dirtywork"
version = "0.1.2"
edition = "2024"

[dependencies]
# anyhow = "1.0.102"
clap = {version = "4.5", features = ["derive"]}
thiserror = "2.0.18"
bytemuck = "1.25.2"
supports-color = "3.0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
